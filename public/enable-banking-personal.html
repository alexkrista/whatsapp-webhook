<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revolut Privat · KRISTINE</title>
<style>body{font:16px system-ui,sans-serif;background:#f5f7f6;color:#19332c;margin:0}main{max-width:920px;margin:40px auto;padding:24px}section{background:white;border:1px solid #dce5e1;border-radius:16px;padding:24px;margin:18px 0}h1{margin:0}small,.muted{color:#587168}button,a.button{background:#1a5848;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf0ee}td:last-child,th:last-child{text-align:right}#message{min-height:1.5em}</style>
<main><a href="/admin/ui">← KRISTINE</a><h1>Revolut Privat</h1><p class="muted">Nur Kontostand und gebuchte Bewegungen · einmal täglich aktualisiert</p><section><div id="message">Lade Bankstatus …</div><p id="account"></p><p id="balance"></p><button id="connect" hidden>Konto freigeben</button> <button id="sync" hidden>Aktualisieren</button><p><small id="time"></small></p></section><section><h2>Bewegungen</h2><div style="overflow-x:auto"><table><thead><tr><th>Datum</th><th>Gegenpartei</th><th>Betrag</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id), money=(amount,currency)=>new Intl.NumberFormat('de-AT',{style:'currency',currency:currency||'EUR'}).format(Number(amount));
function cell(row,value){const td=document.createElement('td');td.textContent=value;row.append(td)}
async function load(){try{const r=await fetch('/banking/enablebanking/status',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Bankstatus nicht verfügbar');$('message').textContent=d.syncError||(!d.configured?'Die Verbindung ist noch nicht aktiviert.':d.connected?'Konto verbunden':'Konto noch nicht freigegeben');$('account').textContent=d.iban?`IBAN ${d.iban}`:'';$('balance').textContent=(d.balances||[]).map(b=>`${b.type||'Saldo'}: ${money(b.amount,b.currency)}`).join(' · ');$('time').textContent=d.updatedAt?`Stand: ${new Date(d.updatedAt).toLocaleString('de-AT')}`:'';$('connect').hidden=!d.configured;$('connect').textContent=d.connected?'Bankfreigabe erneuern':'Konto freigeben';$('sync').hidden=!d.connected||!d.configured;const rows=$('rows');rows.replaceChildren();for(const tx of d.transactions||[]){const tr=document.createElement('tr');cell(tr,tx.bookingDate);cell(tr,`${tx.merchant}${tx.reference?' · '+tx.reference:''}`);cell(tr,money(tx.amount,tx.currency));rows.append(tr)}}catch(e){$('message').textContent=e.message}}
$('connect').onclick=async()=>{try{$('connect').disabled=true;const r=await fetch('/banking/enablebanking/connect',{method:'POST'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Freigabe fehlgeschlagen');location.assign(d.url)}catch(e){$('message').textContent=e.message;$('connect').disabled=false}};
$('sync').onclick=async()=>{try{$('sync').disabled=true;const r=await fetch('/banking/enablebanking/sync',{method:'POST'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Abruf fehlgeschlagen');await load()}catch(e){$('message').textContent=e.message}finally{$('sync').disabled=false}};load();
</script></html>
