<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRISTOOL · Angebots- und Auftragsworkflow</title><style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#20231f;background:#f3f1ec}*{box-sizing:border-box}body{margin:0}.top{background:#152018;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:#bdc9bf}.top a{background:#fff;color:#152018;text-decoration:none;border-radius:9px;padding:9px 12px;font-weight:800}main{max-width:1300px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.lane{background:#ebe8e0;border-radius:16px;padding:13px}.lane h2{margin:2px 3px 12px}.card{background:#fff;border:1px solid #dcd8cf;border-radius:13px;padding:14px;margin-top:10px}.card h3{margin:0 0 5px}.meta{color:#6d716c;font-size:13px}.timeline{display:flex;gap:4px;align-items:center;overflow:auto;margin:13px 0}.step{white-space:nowrap;background:#edf3ee;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750}.step:after{content:' →';color:#999}.step:last-child:after{content:''}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer;background:#2f7548;color:#fff}.actions a{border:1px solid #ccc;border-radius:9px;padding:8px 10px;text-decoration:none;color:#222;font-weight:750}.empty{color:#777;padding:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:20px}}</style></head><body><header class="top"><div><h1>KRISTOOL · Vor-Ort-Protokolle</h1><p>Anruf → Termin → Angebot/Auftrag → Fertig → Rechnung</p></div><a id="towerBack" href="/kontrollzentrum">← KRISTOWER</a></header><main><div class="grid"><section class="lane"><h2>A · Angebotsprotokoll abarbeiten</h2><div id="offers"></div></section><section class="lane"><h2>B · Auftragsmappe vorbereitet · bitte freigeben</h2><div id="orders"></div></section></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const token=new URLSearchParams(location.search).get('token')||'';function authUrl(path){const u=new URL(path,location.origin);if(token)u.searchParams.set('token',token);return u.pathname+u.search}document.getElementById('towerBack').href=authUrl('/kontrollzentrum');async function api(path,opt){const r=await fetch(authUrl(path),{credentials:'same-origin',...opt});const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{throw new Error(text||r.statusText)}if(!r.ok)throw new Error(j.error||r.statusText);return j}function card(w){const steps=(w.timeline||[]).map(x=>`<span class="step">${esc(x.label)}</span>`).join('');const action=w.target==='offer'?`<button onclick="setStatus('${esc(w.id)}','offer_draft')">Angebot erstellen</button>`:`<button onclick="setStatus('${esc(w.id)}','order_approved')">Auftrag freigeben</button>`;return `<article class="card"><h3>${esc(w.title)}</h3><div class="meta">${esc(w.customer||'')} ${w.address?'· '+esc(w.address):''}</div><div class="timeline">${steps}</div><div class="actions">${action}<a href="${authUrl('/kristine?task='+encodeURIComponent(w.taskId))}#tasks" target="_blank">Protokoll öffnen</a></div></article>`}async function load(){const j=await api('/kristool/api/workflows'),rows=j.workflows||[];document.getElementById('offers').innerHTML=rows.filter(x=>x.target==='offer'&&x.status!=='offer_draft').map(card).join('')||'<div class="empty">Keine offenen Angebotsprotokolle.</div>';document.getElementById('orders').innerHTML=rows.filter(x=>x.target==='order'&&x.status!=='order_approved').map(card).join('')||'<div class="empty">Keine Auftragsmappe wartet.</div>'}async function setStatus(id,status){await api(`/kristool/api/workflows/${encodeURIComponent(id)}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}load().catch(e=>document.querySelector('main').innerHTML='<div class="empty">Fehler: '+esc(e.message)+'</div>');
</script></body></html>
