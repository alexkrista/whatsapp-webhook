<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRISTOOL · Angebots- und Auftragsworkflow</title><style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#20231f;background:#f3f1ec}*{box-sizing:border-box}body{margin:0}.top{background:#152018;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:#bdc9bf}.top a{background:#fff;color:#152018;text-decoration:none;border-radius:9px;padding:9px 12px;font-weight:800}main{max-width:1300px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.lane{background:#ebe8e0;border-radius:16px;padding:13px}.lane h2{margin:2px 3px 12px}.card{background:#fff;border:1px solid #dcd8cf;border-radius:13px;padding:14px;margin-top:10px}.card h3{margin:0 0 5px}.meta{color:#6d716c;font-size:13px}.timeline{display:flex;gap:4px;align-items:center;overflow:auto;margin:13px 0}.step{white-space:nowrap;background:#edf3ee;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750}.step:after{content:' →';color:#999}.step:last-child:after{content:''}.folder{margin:12px 0;border-top:1px solid #e6e2da;padding-top:10px}.folder summary{cursor:pointer;font-weight:850;color:#235f39}.field{margin-top:9px}.field b{display:block;font-size:11px;text-transform:uppercase;color:#777;margin-bottom:2px}.field div{white-space:pre-wrap;line-height:1.4}.record{background:#f6f4ef;border-radius:9px;padding:9px;margin-top:8px}.record audio{width:100%;margin-top:6px}.file-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.file-list a{font-size:12px}.job-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#edf4ee;border:1px solid #cbdccf;border-radius:11px;padding:11px;margin:11px 0}.job-form label{font-size:11px;font-weight:800;color:#526057}.job-form input,.job-form select{width:100%;padding:9px;border:1px solid #c9cec9;border-radius:8px;background:#fff}.job-form .wide{grid-column:1/-1}.job-result{padding:10px;border-radius:9px;background:#e5f5e9;color:#155c2a;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer;background:#2f7548;color:#fff}.actions button.danger{margin-left:auto;background:#fff;color:#9c302c;border:1px solid #d7aaa7}.actions a{border:1px solid #ccc;border-radius:9px;padding:8px 10px;text-decoration:none;color:#222;font-weight:750}.empty{color:#777;padding:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}.job-form{grid-template-columns:1fr}.job-form .wide{grid-column:auto}.top{align-items:flex-start}.top h1{font-size:20px}}</style></head><body><header class="top"><div><h1>KRISTOOL · Vor-Ort-Protokolle</h1><p>Anruf → Termin → Angebot/Auftrag → Fertig → Rechnung</p></div><a id="towerBack" href="/kontrollzentrum">← KRISTOWER</a></header><main><div class="grid"><section class="lane"><h2>A · Angebotsprotokoll abarbeiten</h2><div id="offers"></div></section><section class="lane"><h2>B · Auftragsmappe vorbereitet · bitte freigeben</h2><div id="orders"></div></section></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('token')||'';let employees=[];
function authUrl(path){const u=new URL(path,location.origin);if(token)u.searchParams.set('token',token);return u.pathname+u.search}
document.getElementById('towerBack').href=authUrl('/kontrollzentrum');
async function api(path,opt){const r=await fetch(authUrl(path),{credentials:'same-origin',...opt});const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{throw new Error(text||r.statusText)}if(!r.ok)throw new Error(j.error||r.statusText);return j}
function field(label,value){return value?`<div class="field"><b>${label}</b><div>${esc(value)}</div></div>`:''}
function estimatedAmount(value){const nums=String(value||'').match(/\d[\d. ]*/g)||[];return nums.length?Number(nums.at(-1).replace(/[. ]/g,''))||'':''}
function employeeOptions(){return '<option value="">Wer startet?</option>'+employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}
function orderForm(w){
  if(w.jobId)return `<div class="job-result">✓ Baustellenmappe #${esc(w.jobId)} angelegt${w.startDate?` · Start ${esc(w.startDate)}${w.startEmployeeName?` mit ${esc(w.startEmployeeName)}`:''}`:' · Starttermin noch ausmachen'}<div class="actions" style="margin-top:8px"><a href="${authUrl('/public/baustellen.html?edit=1')}#${encodeURIComponent(w.jobId)}" target="_blank">Baustelle ausfüllen</a>${!w.startDate?`<a href="${authUrl('/kristine')}#planning" target="_blank">Direkt einplanen</a>`:''}</div></div>`;
  const amount=estimatedAmount(w.protocol?.estimate),follow=new Date().toISOString().slice(0,10);
  return `<div class="job-form"><div><label>Auftragswert netto</label><input id="amount-${esc(w.id)}" type="number" min="0" value="${esc(amount)}" placeholder="z. B. 3000"></div><div><label>Wer startet?</label><select id="employee-${esc(w.id)}">${employeeOptions()}</select></div><div><label>Starttermin (wenn bekannt)</label><input id="start-${esc(w.id)}" type="date"></div><div><label>Sonst: Erinnerung am</label><input id="follow-${esc(w.id)}" type="date" value="${follow}"></div><div class="wide small">Mit Starttermin wird die Baustelle sofort in der Planung markiert. Ohne Starttermin erzeugt KRISTINE einen Outlook-Termin „Starttermin ausmachen“ mit Link zur Akte.</div><div class="wide actions"><button onclick="createJob('${esc(w.id)}')">Baustellenmappe anlegen</button></div><div id="job-note-${esc(w.id)}" class="wide small"></div></div>`;
}
function card(w){const p=w.protocol||{},steps=(w.timeline||[]).map(x=>`<span class="step">${esc(x.label)}</span>`).join(''),records=(p.recordings||[]).map(r=>`<div class="record"><strong>${r.kind==='own_memo'?'Kalkulationsprotokoll':'Gesprächsprotokoll'}</strong>${r.audioUrl?`<audio controls preload="none" src="${authUrl(r.audioUrl)}"></audio>`:''}${r.transcript?`<div>${esc(r.transcript)}</div>`:''}</div>`).join(''),files=(p.files||[]).map(f=>`<a href="${authUrl(f.url)}" target="_blank">📎 ${esc(f.name||'Anlage')}</a>`).join(''),contents=field('Adresse',w.address)+field('Kontakt',[w.customer,w.contactPhone,w.contactEmail].filter(Boolean).join(' · '))+field('Besprochen / Kundenwunsch',p.discussion)+field('Vereinbarte Arbeiten',p.work)+field('Preisschätzung',p.estimate)+field('Nächste Schritte',p.nextSteps)+records+(files?`<div class="file-list">${files}</div>`:'');const action=w.target==='offer'?`<button onclick="setStatus('${esc(w.id)}','offer_draft')">Angebot erstellen</button>`:'';return `<article id="workflow-${esc(w.id)}" class="card"><h3>${esc(w.title)}</h3><div class="meta">${esc(w.customer||'')} ${w.address?'· '+esc(w.address):''}</div><div class="timeline">${steps}</div><details class="folder" open><summary>Vollständige Mappe</summary>${contents||'<div class="empty">Noch keine Protokolldaten vorhanden.</div>'}</details>${w.target==='order'?orderForm(w):''}<div class="actions">${action}<a href="${authUrl('/kristine?task='+encodeURIComponent(w.taskId))}#tasks" target="_blank">Ursprüngliche Aufgabe öffnen</a><button class="danger" onclick="deleteWorkflow('${esc(w.id)}')">Mappe löschen</button></div></article>`}
async function createJob(id){const note=document.getElementById('job-note-'+id),select=document.getElementById('employee-'+id),startDate=document.getElementById('start-'+id).value,followDate=document.getElementById('follow-'+id).value,contractAmount=Number(document.getElementById('amount-'+id).value||0);if(startDate&&!select.value){note.textContent='Bitte auswählen, wer startet.';return}note.textContent='Baustellenmappe wird angelegt …';try{const result=await api(`/kristool/api/workflows/${encodeURIComponent(id)}/create-job`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contractAmount,startDate,employeeId:select.value,employeeName:select.selectedOptions[0]?.textContent||''})});if(result.needsStartAppointment&&followDate){const link=location.origin+authUrl('/kristine')+'#planning';await api('/kristine/api/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Starttermin ausmachen · '+result.workflow.title,date:followDate,allDay:true,from:'',to:'',location:result.workflow.address||'',details:'Baustellenmappe #'+result.jobId+' noch einplanen\n'+link,taskId:result.workflow.taskId,requestId:'start-'+result.jobId})})}location.href=authUrl('/public/baustellen.html?edit=1')+'#'+encodeURIComponent(result.jobId)}catch(e){note.textContent='Fehler: '+e.message}}
async function load(){const [j,b]=await Promise.all([api('/kristool/api/workflows'),api('/kristine/api/bootstrap').catch(()=>({employees:[]}))]);employees=b.employees||[];const rows=j.workflows||[],closed=['offer_draft','order_approved','order_job_created'];document.getElementById('offers').innerHTML=rows.filter(x=>x.target==='offer'&&!closed.includes(x.status)).map(card).join('')||'<div class="empty">Keine offenen Angebotsprotokolle.</div>';document.getElementById('orders').innerHTML=rows.filter(x=>x.target==='order'&&!closed.includes(x.status)).map(card).join('')||'<div class="empty">Keine Auftragsmappe wartet.</div>';if(location.hash)document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({behavior:'smooth',block:'start'})}
async function setStatus(id,status){await api(`/kristool/api/workflows/${encodeURIComponent(id)}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
async function deleteWorkflow(id){if(!confirm('Diese Mappe aus dem Arbeitskorb löschen? Eine bereits angelegte Baustelle bleibt erhalten.'))return;await api(`/kristool/api/workflows/${encodeURIComponent(id)}`,{method:'DELETE'});await load()}
load().catch(e=>document.querySelector('main').innerHTML='<div class="empty">Fehler: '+esc(e.message)+'</div>');
</script></body></html>
