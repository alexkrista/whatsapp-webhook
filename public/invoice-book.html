<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRISTINE · Rechnungsbuch</title>
<style>
:root{color-scheme:dark;--bg:#101316;--card:#171b20;--line:#343c46;--text:#eef2f4;--muted:#9da8b3;--green:#438b5c;--blue:#315d91;--gold:#7c641d;--red:#82443e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.shell{max-width:1600px;margin:auto;padding:20px}.head,.actions,.filters,.row-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.head h1{margin:0}.sub,.small{color:var(--muted);font-size:13px}.button,button{border:1px solid #4a5662;border-radius:10px;padding:10px 14px;background:#252c34;color:var(--text);font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.button.primary,button.primary{background:var(--green);border-color:var(--green)}button.pay{background:var(--blue);border-color:var(--blue)}button.done{background:var(--gold);border-color:var(--gold)}.filters,.card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;margin-top:16px}.filters{justify-content:flex-start}.filters input,.filters select{background:#0f1215;color:var(--text);border:1px solid #4a5662;border-radius:10px;padding:12px;font:inherit}.filters input{min-width:min(360px,100%);flex:1}.summary{margin:16px 2px}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}.month{border:1px solid var(--line);border-radius:12px;background:#14191e;padding:12px}.month strong{font-size:17px}.month-line{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.invoice{border-top:1px solid var(--line);padding:15px 4px}.invoice:first-child{border-top:0}.grid{display:grid;grid-template-columns:125px minmax(210px,1.5fr) minmax(120px,.8fr) 130px 165px minmax(290px,auto);gap:12px;align-items:center}.supplier{font-weight:850;font-size:16px}.book-number{display:inline-block;margin-top:4px;padding:3px 7px;border:1px solid #52606d;border-radius:999px;font-size:11px;font-weight:850}.amount{text-align:right;font-weight:850;font-size:16px}.badge{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:850}.badge.open{background:#263f57;color:#bbdcff}.badge.paid{background:#23442f;color:#b9efc8}.badge.sepa_submitted{background:#54451d;color:#ffe7a0}.source-note{margin-top:6px;color:#f3c786;font-size:11px}.history{margin:12px 0 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#11151a}.history-row{padding:7px 0;border-top:1px solid #2a3038}.history-row:first-child{border-top:0}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.amount{text-align:left}}@media(max-width:620px){.grid{grid-template-columns:1fr}.filters input{min-width:100%}.actions{justify-content:flex-start}}
@media print{body{background:white;color:black}.filters,.head .actions,.invoice .actions{display:none}.card,.month{background:white;border-color:#aaa}.shell{padding:0}.invoice{break-inside:avoid}}
</style>
</head>
<body>
<main class="shell">
  <div class="head">
    <div><div class="sub">KRISTINE · HISTORISCHE ABLAGE</div><h1>📚 Rechnungsbuch Eingang</h1><div class="sub">Eingangsrechnungen aus WinWorker und KRISTINE · Originalbelege · Zahlungsstatus · Änderungen nachvollziehbar</div></div>
    <div class="actions"><a class="button" href="/outgoing/invoice-book">Rechnungsbuch Ausgang</a><button type="button" onclick="window.print()">Drucken</button><a class="button primary" href="/incoming/payments">Kreditoren-OP / Zahlungslauf →</a><a class="button" href="/">← The Brain</a></div>
  </div>
  <section class="filters">
    <input id="q" type="search" placeholder="Lieferant oder Rechnungsnummer – z. B. Loacker" autofocus>
    <select id="year"><option value="0">Alle Jahre</option></select>
    <select id="month"><option value="">Alle Monate</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
    <label>Von <input id="from" type="date"></label><label>Bis <input id="to" type="date"></label>
    <select id="paymentChannel"><option value="all">Alle Zahlungsarten</option><option value="bank">Bank (SEPA + Einzug)</option><option value="revolut">Revolut</option><option value="revolut_business">Revolut Business</option><option value="cash">Kassa</option><option value="unknown">Noch offen</option></select>
    <select id="state"><option value="all">Alle Status</option><option value="open">Nur offen</option><option value="paid">Nur bezahlt</option></select>
    <select id="sort"><option value="book-desc">Buchungsnummer ↓</option><option value="book-asc">Buchungsnummer ↑</option><option value="date-desc">Rechnungsdatum ↓</option><option value="supplier">Lieferant A–Z</option><option value="payment">Zahlungsart</option><option value="amount-desc">Betrag ↓</option></select>
    <button id="search" class="primary" type="button">Suchen</button>
  </section>
  <div class="summary" id="summary">Rechnungsbuch wird geladen …</div>
  <section class="months" id="months"></section>
  <section class="card" id="rows"><div class="empty">Das Rechnungsbuch wartet auf deine Suche.</div></section>
</main>
<script>
(()=>{
// BEGIN operational invoice balances
function reconcileBookBalances(rows, payments) {
  if (!payments || payments.ok !== true || !['items','submitted','directDebit'].every(k=>Array.isArray(payments[k]))) throw Error('Kreditoren und Einzüge konnten nicht vollständig abgeglichen werden.');
  const key=x=>JSON.stringify([x.source,x.id]), active=new Map();
  for (const group of ['items','submitted','directDebit']) for (const x of payments[group]) {
    if (x.paymentStatus === 'paid') continue;
    const amount=Number(x.amount);
    if (!Number.isFinite(amount)) throw Error('Offener Betrag konnte nicht geprüft werden.');
    active.set(key(x), {amount, submitted:group==='submitted'});
  }
  const months=new Map();
  const items=rows.map(x=>{
    const hit=active.get(key(x)), value=Number(x.amount||0);
    const historicalWW=x.source==='WinWorker' && /^\d{4}-\d{2}-\d{2}/.test(x.invoiceDate||'') && x.invoiceDate.slice(0,10)<='2026-09-25';
    const open=historicalWW?(hit?hit.amount:0):(x.paymentStatus==='paid'?0:Number(x.openAmount??(value-Number(x.bankPaid||0))));
    const paid=value-open;
    const bookStatus=historicalWW?(hit&&Math.abs(open)>.004?(hit.submitted?'sepa_submitted':'open'):'paid'):x.paymentStatus;
    const month=String(x.invoiceDate||'').slice(0,7)||'Ohne Datum';
    if(!months.has(month))months.set(month,{month,count:0,total:0,paid:0,open:0});
    const m=months.get(month);m.count++;m.total+=value;m.paid+=paid;m.open+=open;
    return {...x,bookStatus,bookOpen:Math.abs(open)>.004,bookOpenAmount:open};
  });
  return {items,months:[...months.values()].sort((a,b)=>b.month.localeCompare(a.month)).map(m=>({...m,...Object.fromEntries(['total','paid','open'].map(k=>[k,Math.round(m[k]*100)/100]))}))};
}
// END operational invoice balances
// BEGIN invoice book filters
function bookPaymentChannel(value){return ['transfer','direct_debit'].includes(value)?'bank':value||'unknown'}
function filterBookRows(rows,f){return rows.filter(x=>{const day=String(x.invoiceDate||'').slice(0,10);return (!f.month||day.slice(5,7)===f.month)&&(!f.from||day>=f.from)&&(!f.to||(day&&day<=f.to))&&(f.paymentChannel==='all'||bookPaymentChannel(x.paymentMethod)===f.paymentChannel)})}
function filteredBookMonths(rows){const buckets=new Map();for(const x of rows){const month=String(x.invoiceDate||'').slice(0,7)||'Ohne Datum',currency=x.currency||'EUR',key=JSON.stringify([month,currency]);if(!buckets.has(key))buckets.set(key,{month,currency,count:0,total:0,paid:0,open:0});const b=buckets.get(key),total=Number(x.amount||0),open=Number(x.bookOpenAmount||0);b.count++;b.total+=total;b.open+=open;b.paid+=total-open}return [...buckets.values()].sort((a,b)=>b.month.localeCompare(a.month)||a.currency.localeCompare(b.currency)).map(b=>({...b,...Object.fromEntries(['total','paid','open'].map(k=>[k,Math.round(b[k]*100)/100]))}))}
// END invoice book filters

const token='__TOKEN__',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=(n,c='EUR')=>{try{return new Intl.NumberFormat('de-AT',{style:'currency',currency:c||'EUR'}).format(Number(n||0))}catch(_){return Number(n||0).toFixed(2)+' '+(c||'EUR')}},date=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:(s||'–')},status=s=>s==='paid'?'Bezahlt':s==='sepa_submitted'?'SEPA übergeben':'Offen';let items=[],monthTotals=[];
const current=new Date().getFullYear();for(let y=current;y>=2010;y--){const o=document.createElement('option');o.value=String(y);o.textContent=String(y);$('year').append(o)}$('year').value=String(current);
function sourceText(x){if(!x.statusOverride)return x.source;return `${x.source} meldet „${x.sourcePaymentLabel||status(x.sourcePaymentStatus)}“ · Brain-Korrektur „${status(x.paymentStatus)}“`}
function sortedRows(){const state=$('state').value,sort=$('sort').value,out=filterBookRows(items,{month:$('month').value,from:$('from').value,to:$('to').value,paymentChannel:$('paymentChannel').value}).filter(x=>state==='all'||(state==='open'?x.bookOpen:x.bookStatus===state));out.sort((a,b)=>sort==='book-asc'?Number(String(a.bookNumber).replace(/\D/g,''))-Number(String(b.bookNumber).replace(/\D/g,'')):sort==='date-desc'?String(b.invoiceDate).localeCompare(String(a.invoiceDate)):sort==='payment'?bookPaymentChannel(a.paymentMethod).localeCompare(bookPaymentChannel(b.paymentMethod))||String(a.supplier).localeCompare(String(b.supplier),'de'):sort==='supplier'?String(a.supplier).localeCompare(String(b.supplier),'de'):sort==='amount-desc'?Number(b.amount)-Number(a.amount):Number(String(b.bookNumber).replace(/\D/g,''))-Number(String(a.bookNumber).replace(/\D/g,'')));return out}
function renderMonths(){monthTotals=filteredBookMonths(sortedRows());const wanted=$('state').value;$('months').innerHTML=monthTotals.map(m=>`<div class="month"><strong>${esc(m.month)}</strong><div class="month-line"><span>${m.count} Rechnung(en)</span><b>${esc(money(m.total,m.currency))}</b></div><div class="month-line small"><span>Bezahlt ${esc(money(m.paid,m.currency))}</span><span>Offen ${esc(money(m.open,m.currency))}</span></div></div>`).join('');$('months').hidden=false}
function render(){if($('from').value&&$('to').value&&$('from').value>$('to').value){$('summary').textContent='Datum von muss vor Datum bis liegen.';$('rows').innerHTML='';$('months').innerHTML='';return}const box=$('rows'),rows=sortedRows();renderMonths();$('summary').textContent=`${rows.length} von ${items.length} Rechnung(en) · laufende Buchungsnummer · WW-Altbestand: Offen laut Kreditoren und Einzügen`;box.innerHTML=rows.length?rows.map((x,i)=>`<article class="invoice"><div class="grid"><div><strong>${esc(date(x.invoiceDate))}</strong><div class="small">${esc(x.source)}</div><span class="book-number">${esc(x.bookNumber||'ohne Nr.')}</span></div><div><div class="supplier">${esc(x.supplier||'–')}</div><div class="small">Beleg ${esc(x.docId||'–')}</div></div><div><strong>${esc(x.invoiceNumber||'–')}</strong><div class="small">Rechnungsnummer</div></div><div class="amount">${esc(money(x.amount,x.currency))}</div><div><span class="badge ${esc(x.bookStatus)}">${esc(status(x.bookStatus))}</span><div class="small">${esc(({transfer:'Bank / SEPA',direct_debit:'Bank / Einzug',revolut:'Revolut',revolut_business:'Revolut Business',cash:'Kassa'})[x.paymentMethod]||'Zahlungsart offen')}</div>${x.statusOverride?`<div class="source-note">${esc(sourceText(x))}</div>`:''}</div><div class="actions">${x.path?`<a class="button" href="/pdf?path=${encodeURIComponent(x.path)}" target="_blank" rel="noopener">PDF</a>`:''}${x.bookStatus==='open'?`<button class="done" data-action="paid" data-id="${esc(x.source)}|${esc(x.id)}">Als bezahlt</button>`:`<button data-action="open" data-id="${esc(x.source)}|${esc(x.id)}">Wieder öffnen</button><button class="pay" data-action="repay" data-id="${esc(x.source)}|${esc(x.id)}">Nochmals Zahlungslauf</button>`}<button data-history="${esc(x.source)}|${esc(x.id)}">Historie</button></div></div><div class="history" data-history-box="${esc(x.source)}|${esc(x.id)}" hidden></div></article>`).join(''):'<div class="empty">Keine Rechnung gefunden.</div>';box.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const [source,id]=b.dataset.id.split('|');change(items.find(x=>x.source===source&&x.id===id),b.dataset.action)});box.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{const [source,id]=b.dataset.history.split('|');history(items.find(x=>x.source===source&&x.id===id),b.dataset.history)}) }
async function load(){const q=$('q').value.trim(),year=$('year').value;if(q.length===1){$('summary').textContent='Bitte mindestens zwei Zeichen suchen.';return}$('summary').textContent='Rechnungsbuch wird durchsucht …';$('months').innerHTML='';items=[];monthTotals=[];$('rows').innerHTML='<div class="empty">Wird geladen …</div>';try{const r=await fetch('/incoming/invoice-book/items?'+new URLSearchParams({q,year}),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Abruf fehlgeschlagen');const pr=await fetch('/incoming/payment-open-items',{cache:'no-store'}),pd=await pr.json();if(!pr.ok)throw Error('Kreditoren und Einzüge nicht erreichbar');const reconciled=reconcileBookBalances(d.items||[],pd);items=reconciled.items;monthTotals=reconciled.months;render()}catch(e){$('summary').textContent=e.message;$('rows').innerHTML='<div class="empty">Abruf fehlgeschlagen.</div>'}}
async function change(x,action){if(!x)return;const verb=action==='repay'?'NOCHMALS ÜBER DEN ZAHLUNGSLAUF bezahlen':action==='open'?'wieder als OFFEN führen':'als BEZAHLT markieren';if(!confirm(`${x.supplier}\n${x.invoiceNumber||x.docId} · ${money(x.amount,x.currency)}\n\nDiese Rechnung wirklich ${verb}?`))return;const defaults={repay:'In WinWorker fälschlich als bezahlt markiert',open:'Buchungsstatus korrigiert',paid:'Zahlung kontrolliert'};const reason=prompt('Grund für die Statusänderung:',defaults[action]);if(reason===null)return;if(reason.trim().length<3){alert('Bitte einen Grund angeben.');return}try{const r=await fetch('/incoming/invoice-book/status',{method:'POST',headers:{'Content-Type':'application/json','X-Invoice-Book':token},body:JSON.stringify({source:x.source,id:x.id,action,reason,changedBy:'Alex'})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Änderung fehlgeschlagen');alert(d.message);await load()}catch(e){alert(e.message)}}
async function history(x,key){if(!x)return;const box=[...document.querySelectorAll('[data-history-box]')].find(node=>node.dataset.historyBox===key);if(!box)return;if(!box.hidden){box.hidden=true;return}box.hidden=false;box.innerHTML='Historie wird geladen …';try{const r=await fetch('/incoming/invoice-book/history?'+new URLSearchParams({source:x.source,id:x.id}),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Historie nicht erreichbar');box.innerHTML=(d.items||[]).length?(d.items||[]).map(h=>`<div class="history-row"><strong>${esc(status(h.old_status))} → ${esc(status(h.new_status))}</strong> · ${esc(date(h.changed_at))}<div class="small">${esc(h.reason)} · ${esc(h.changed_by)}</div></div>`).join(''):'<div class="small">Noch keine manuelle Statusänderung.</div>'}catch(e){box.textContent=e.message}}
$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};$('sort').onchange=render;$('state').onchange=render;$('year').onchange=load;for(const id of ['month','from','to','paymentChannel'])$(id).onchange=render;load();
})();
</script>
</body>
</html>
