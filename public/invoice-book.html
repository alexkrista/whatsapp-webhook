<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRISTINE · Rechnungsbuch</title>
<style>
:root{color-scheme:dark;--bg:#101316;--card:#171b20;--line:#343c46;--text:#eef2f4;--muted:#9da8b3;--green:#438b5c;--blue:#315d91;--gold:#7c641d;--red:#82443e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.shell{max-width:1600px;margin:auto;padding:20px}.head,.actions,.filters,.row-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.head h1{margin:0}.sub,.small{color:var(--muted);font-size:13px}.button,button{border:1px solid #4a5662;border-radius:10px;padding:10px 14px;background:#252c34;color:var(--text);font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.button.primary,button.primary{background:var(--green);border-color:var(--green)}button.pay{background:var(--blue);border-color:var(--blue)}button.done{background:var(--gold);border-color:var(--gold)}.filters,.card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;margin-top:16px}.filters{justify-content:flex-start}.filters input,.filters select{background:#0f1215;color:var(--text);border:1px solid #4a5662;border-radius:10px;padding:12px;font:inherit}.filters input{min-width:min(440px,100%);flex:1}.summary{margin:16px 2px}.invoice{border-top:1px solid var(--line);padding:15px 4px}.invoice:first-child{border-top:0}.grid{display:grid;grid-template-columns:115px minmax(210px,1.5fr) minmax(120px,.8fr) 130px 165px minmax(250px,auto);gap:12px;align-items:center}.supplier{font-weight:850;font-size:16px}.amount{text-align:right;font-weight:850;font-size:16px}.badge{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:850}.badge.open{background:#263f57;color:#bbdcff}.badge.paid{background:#23442f;color:#b9efc8}.badge.sepa_submitted{background:#54451d;color:#ffe7a0}.source-note{margin-top:6px;color:#f3c786;font-size:11px}.history{margin:12px 0 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#11151a}.history-row{padding:7px 0;border-top:1px solid #2a3038}.history-row:first-child{border-top:0}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.amount{text-align:left}}@media(max-width:620px){.grid{grid-template-columns:1fr}.filters input{min-width:100%}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<main class="shell">
  <div class="head">
    <div><div class="sub">KRISTINE · HISTORISCHE ABLAGE</div><h1>📚 Rechnungsbuch</h1><div class="sub">Eingangsrechnungen aus WinWorker und KRISTINE · Originalbelege · Zahlungsstatus · Änderungen nachvollziehbar</div></div>
    <div class="actions"><a class="button primary" href="/incoming/payments">Kreditoren-OP / Zahlungslauf →</a><a class="button" href="/">← The Brain</a></div>
  </div>
  <section class="filters">
    <input id="q" type="search" placeholder="Lieferant oder Rechnungsnummer – z. B. Loacker" autofocus>
    <select id="year"><option value="0">Alle Jahre</option></select>
    <button id="search" class="primary" type="button">Suchen</button>
  </section>
  <div class="summary" id="summary">Bitte Lieferant oder Rechnungsnummer eingeben.</div>
  <section class="card" id="rows"><div class="empty">Das Rechnungsbuch wartet auf deine Suche.</div></section>
</main>
<script>
(()=>{
const token='__TOKEN__',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=(n,c='EUR')=>{try{return new Intl.NumberFormat('de-AT',{style:'currency',currency:c||'EUR'}).format(Number(n||0))}catch(_){return Number(n||0).toFixed(2)+' '+(c||'EUR')}},date=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:(s||'–')},status=s=>s==='paid'?'Bezahlt':s==='sepa_submitted'?'SEPA übergeben':'Offen';let items=[];
const current=new Date().getFullYear();for(let y=current;y>=2010;y--){const o=document.createElement('option');o.value=String(y);o.textContent=String(y);$('year').append(o)}
function sourceText(x){if(!x.statusOverride)return x.source;return `${x.source} meldet „${x.sourcePaymentLabel||status(x.sourcePaymentStatus)}“ · Brain-Korrektur „${status(x.paymentStatus)}“`}
function render(){const box=$('rows');box.innerHTML=items.length?items.map((x,i)=>`<article class="invoice"><div class="grid"><div><strong>${esc(date(x.invoiceDate))}</strong><div class="small">${esc(x.source)}</div></div><div><div class="supplier">${esc(x.supplier||'–')}</div><div class="small">Beleg ${esc(x.docId||'–')}</div></div><div><strong>${esc(x.invoiceNumber||'–')}</strong><div class="small">Rechnungsnummer</div></div><div class="amount">${esc(money(x.amount,x.currency))}</div><div><span class="badge ${esc(x.paymentStatus)}">${esc(status(x.paymentStatus))}</span>${x.statusOverride?`<div class="source-note">${esc(sourceText(x))}</div>`:''}</div><div class="actions">${x.path?`<a class="button" href="/pdf?path=${encodeURIComponent(x.path)}" target="_blank" rel="noopener">PDF</a>`:''}${x.paymentStatus==='open'?`<button class="done" data-action="paid" data-i="${i}">Als bezahlt</button>`:`<button class="pay" data-action="repay" data-i="${i}">Nochmals Zahlungslauf</button>`}<button data-history="${i}">Historie</button></div></div><div class="history" id="history-${i}" hidden></div></article>`).join(''):'<div class="empty">Keine Rechnung gefunden.</div>';box.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>change(items[Number(b.dataset.i)],b.dataset.action));box.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>history(items[Number(b.dataset.history)],Number(b.dataset.history))) }
async function load(){const q=$('q').value.trim(),year=$('year').value;if(q.length<2&&!Number(year)){$('summary').textContent='Bitte mindestens zwei Zeichen oder ein Jahr auswählen.';return}$('summary').textContent='Rechnungsbuch wird durchsucht …';$('rows').innerHTML='<div class="empty">Wird geladen …</div>';try{const r=await fetch('/incoming/invoice-book/items?'+new URLSearchParams({q,year}),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Abruf fehlgeschlagen');items=d.items||[];$('summary').textContent=`${items.length} Rechnung(en) gefunden`;render()}catch(e){$('summary').textContent=e.message;$('rows').innerHTML='<div class="empty">Abruf fehlgeschlagen.</div>'}}
async function change(x,action){const verb=action==='repay'?'NOCHMALS ÜBER DEN ZAHLUNGSLAUF bezahlen':'als BEZAHLT markieren';if(!confirm(`${x.supplier}\n${x.invoiceNumber||x.docId} · ${money(x.amount,x.currency)}\n\nDiese Rechnung wirklich ${verb}?`))return;const reason=prompt('Grund für die Statusänderung:',action==='repay'?'In WinWorker fälschlich als bezahlt markiert':'Zahlung kontrolliert');if(reason===null)return;if(reason.trim().length<3){alert('Bitte einen Grund angeben.');return}try{const r=await fetch('/incoming/invoice-book/status',{method:'POST',headers:{'Content-Type':'application/json','X-Invoice-Book':token},body:JSON.stringify({source:x.source,id:x.id,action,reason,changedBy:'Alex'})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Änderung fehlgeschlagen');alert(d.message);await load()}catch(e){alert(e.message)}}
async function history(x,i){const box=$(`history-${i}`);if(!box.hidden){box.hidden=true;return}box.hidden=false;box.innerHTML='Historie wird geladen …';try{const r=await fetch('/incoming/invoice-book/history?'+new URLSearchParams({source:x.source,id:x.id}),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Historie nicht erreichbar');box.innerHTML=(d.items||[]).length?(d.items||[]).map(h=>`<div class="history-row"><strong>${esc(status(h.old_status))} → ${esc(status(h.new_status))}</strong> · ${esc(date(h.changed_at))}<div class="small">${esc(h.reason)} · ${esc(h.changed_by)}</div></div>`).join(''):'<div class="small">Noch keine manuelle Statusänderung.</div>'}catch(e){box.textContent=e.message}}
$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};
})();
</script>
</body>
</html>
