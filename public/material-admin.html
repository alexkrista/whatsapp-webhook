<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>KRISTINE · Material</title>
<style>
:root{
  --navy:#10233f;--blue:#246fd6;--green:#1f7a4d;--green-soft:#e8f3ed;
  --bg:#f4f6f8;--ink:#17211c;--muted:#69746e;--line:#dce4df;
  --warn:#fff3d1;--warn-ink:#8a5a00;--danger:#ffe9e9;--danger-ink:#a02626;
  --ordered:#eaf1ff;--ordered-ink:#2355a0;--white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
header{
  padding:20px 24px;display:flex;justify-content:space-between;align-items:center;
  background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;
  box-shadow:0 8px 24px rgba(16,35,63,.12)
}
h1{margin:0;font-size:25px}.sub{font-size:13px;color:rgba(255,255,255,.68);margin-top:3px}
.wrap{max-width:1220px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(16,35,63,.04)}
.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.btn,input,select{
  font:inherit;border-radius:13px;border:1px solid var(--line);padding:11px 13px;background:#fff
}
.btn{font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.98)}
.primary{background:var(--green);color:#fff;border-color:var(--green)}
.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--green-soft);font-size:12px;font-weight:850}
.yellow{background:var(--warn);color:var(--warn-ink)}.red{background:var(--danger);color:var(--danger-ink)}
.tabs{display:flex;gap:8px;margin:18px 0;overflow:auto;padding-bottom:2px}
.tabs button{white-space:nowrap}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.hidden{display:none}.inbox,.request-list{display:grid;gap:12px}
.inbox-item,.request-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.request-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.request-title{font-size:17px;font-weight:900;margin-bottom:6px}
.request-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.request-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status-open{background:var(--warn);color:var(--warn-ink)}
.status-stocked{background:var(--green-soft);color:var(--green)}
.status-ordered{background:var(--ordered);color:var(--ordered-ink)}
.request-empty{text-align:center;padding:34px}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:8px 0 12px}
.section-head h2{margin:0}.count-badge{font-weight:900;color:var(--muted)}
dialog{border:0;border-radius:22px;padding:0;max-width:650px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form h2,.form .wide{grid-column:1/-1}.form label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
@media(max-width:800px){
  .grid{grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}
  .form{grid-template-columns:1fr}.form h2,.form .wide{grid-column:auto}
  .request-item{grid-template-columns:1fr}.request-actions{justify-content:flex-start}
}
</style>
</head>
<body>
<header>
  <div><h1>KRISTINE Material</h1><div class="sub">Materialstamm und Anforderungen</div></div>
  <strong id="dataStatus">Datenstand –</strong>
</header>

<div class="wrap">
  <div class="grid">
    <div class="card"><div class="muted">Materialien</div><div class="big" id="count">0</div></div>
    <div class="card"><div class="muted">Preise prüfen</div><div class="big" id="stale">0</div></div>
    <div class="card"><div class="muted">Neue Materialien</div><div class="big" id="inboxCount">0</div></div>
    <div class="card"><div class="muted">Materialbedarf offen</div><div class="big" id="requestOpenCount">0</div></div>
  </div>

  <div class="tabs">
    <button class="btn active" id="tabRequests" onclick="showTab('requests')">Materialbedarf</button>
    <button class="btn" id="tabMaterials" onclick="showTab('materials')">Materialstamm</button>
    <button class="btn" id="tabInbox" onclick="showTab('inbox')">Neu gelernt / offen</button>
  </div>

  <section id="requests">
    <div class="toolbar">
      <button class="btn active request-filter" data-status="open" onclick="setRequestFilter('open',this)">Offen</button>
      <button class="btn request-filter" data-status="stocked" onclick="setRequestFilter('stocked',this)">Lagernd</button>
      <button class="btn request-filter" data-status="ordered" onclick="setRequestFilter('ordered',this)">Bestellt</button>
      <button class="btn" onclick="loadRequests()">Aktualisieren</button>
    </div>
    <div class="section-head">
      <div><h2 id="requestHeading">Offene Materialanforderungen</h2><div class="muted">Von KRISTINE GO gemeldet</div></div>
      <div class="count-badge" id="requestVisibleCount">0 Einträge</div>
    </div>
    <div class="request-list" id="requestRows"></div>
  </section>

  <section id="materials" class="hidden">
    <div class="toolbar">
      <input id="search" placeholder="Material, Farbnummer 154, Produkt …">
      <select id="group"><option value="">Alle Gruppen</option></select>
      <button class="btn" onclick="loadMaterials()">Suchen</button>
      <label class="btn">Excel importieren<input id="file" type="file" accept=".xlsx,.xls" hidden onchange="importExcel(this.files[0])"></label>
      <button class="btn" onclick="exportExcel()">Excel exportieren</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Gruppe</th><th>Material</th><th>Farbton</th><th>EK / VK</th><th>Preisstand</th><th>Aktion</th></tr></thead>
        <tbody id="materialRows"></tbody>
      </table>
    </div>
  </section>

  <section id="inbox" class="hidden">
    <div class="inbox" id="inboxRows"></div>
  </section>
</div>

<dialog id="learnDialog">
<form class="form" method="dialog" onsubmit="approveMaterial(event)">
  <h2>Neues Material sauber anlegen</h2>
  <input type="hidden" id="learnId">
  <label>Gruppe<input id="learnGroup" required></label>
  <label>Untergruppe<input id="learnSubgroup"></label>
  <label>Hersteller<input id="learnManufacturer"></label>
  <label>Produkt<input id="learnProduct" required></label>
  <label>Farbnummer<input id="learnColorNumber"></label>
  <label>Farbname<input id="learnColorName"></label>
  <label>Einheit<input id="learnUnit"></label>
  <label>Ort-Abfrage<select id="learnLocation"><option value="none">Keine</option><option value="room">Raum</option><option value="component">Bauteil</option><option value="area">Bereich/Fassade</option></select></label>
  <label>EK (€)<input id="learnEk" inputmode="decimal"></label>
  <label>VK (€)<input id="learnVk" inputmode="decimal"></label>
  <label>Preis gültig ab<input id="learnPriceDate" type="date"></label>
  <label>Gestaltungsauftrag<select id="learnDesign"><option value="false">Nein</option><option value="true">Ja</option></select></label>
  <div class="wide toolbar">
    <button type="button" class="btn" onclick="learnDialog.close()">Abbrechen</button>
    <button class="btn primary">Material anlegen und lernen</button>
  </div>
</form>
</dialog>

<script>
const token=new URLSearchParams(location.search).get("token")||"";
const api=(url,opt={})=>fetch(
  url+(url.includes("?")?"&":"?")+"token="+encodeURIComponent(token),
  {headers:{"Content-Type":"application/json"},...opt}
).then(async r=>{
  const body=await r.json().catch(()=>({error:"Unbekannter Fehler"}));
  if(!r.ok)throw new Error(body.error||"Fehler");
  return body;
});

let inboxItems=[];
let materialRequests=[];
let requestFilter="open";

function statusLabel(status){
  return status==="stocked"?"Lagernd":status==="ordered"?"Bestellt":"Offen";
}
function needLabel(value){
  return value==="urgent_today"?"Heute dringend":value==="tomorrow"?"Für morgen":"Dokumentation";
}
function statusClass(status){
  return status==="stocked"?"status-stocked":status==="ordered"?"status-ordered":"status-open";
}
function formatDateTime(value){
  if(!value)return"";
  const d=new Date(value);
  return Number.isNaN(d.getTime())?String(value):d.toLocaleString("de-AT",{dateStyle:"short",timeStyle:"short"});
}

async function loadRequests(){
  try{
    const data=await api("/kristine/api/material-requests");
    materialRequests=Array.isArray(data.requests)?data.requests:[];
    requestOpenCount.textContent=materialRequests.filter(x=>x.status==="open").length;
    renderRequests();
  }catch(error){
    requestRows.innerHTML=`<div class="card request-empty"><strong>Materialbedarf konnte nicht geladen werden.</strong><p class="muted">${escapeHtml(error.message)}</p></div>`;
  }
}

function setRequestFilter(status,button){
  requestFilter=status;
  document.querySelectorAll(".request-filter").forEach(x=>x.classList.toggle("active",x===button));
  renderRequests();
}

function renderRequests(){
  const titles={open:"Offene Materialanforderungen",stocked:"Lagernd",ordered:"Bestellt"};
  requestHeading.textContent=titles[requestFilter]||"Materialanforderungen";

  const rows=materialRequests
    .filter(x=>(x.status||"open")===requestFilter)
    .sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));

  requestVisibleCount.textContent=`${rows.length} ${rows.length===1?"Eintrag":"Einträge"}`;

  if(!rows.length){
    requestRows.innerHTML=`<div class="card request-empty"><strong>Keine Einträge.</strong><p class="muted">${requestFilter==="open"?"Alles bearbeitet.":""}</p></div>`;
    return;
  }

  requestRows.innerHTML=rows.map(x=>`
    <article class="request-item">
      <div>
        <div class="request-title">${escapeHtml(x.materialText||"Material")}</div>
        <div class="request-meta">
          <span class="pill ${statusClass(x.status)}">${statusLabel(x.status)}</span>
          <span class="pill ${x.need==="urgent_today"?"red":x.need==="tomorrow"?"yellow":""}">${needLabel(x.need)}</span>
          ${x.newMaterial?'<span class="pill yellow">Neues Material</span>':""}
        </div>
        <p class="muted">
          <strong>${escapeHtml(x.jobName||x.jobId||"Ohne Baustelle")}</strong>
          ${x.jobId?` · #${escapeHtml(x.jobId)}`:""}
          ${x.employeeName?` · ${escapeHtml(x.employeeName)}`:""}
          ${x.createdAt?` · ${escapeHtml(formatDateTime(x.createdAt))}`:""}
        </p>
        ${x.note?`<p>${escapeHtml(x.note)}</p>`:""}
      </div>
      <div class="request-actions">
        ${x.status!=="open"?`<button class="btn" onclick="setMaterialStatus('${js(x.id)}','open')">Offen</button>`:""}
        ${x.status!=="stocked"?`<button class="btn primary" onclick="setMaterialStatus('${js(x.id)}','stocked')">Lagernd</button>`:""}
        ${x.status!=="ordered"?`<button class="btn navy" onclick="setMaterialStatus('${js(x.id)}','ordered')">Bestellt</button>`:""}
      </div>
    </article>
  `).join("");
}

async function setMaterialStatus(id,status){
  const labels={open:"Offen",stocked:"Lagernd",ordered:"Bestellt"};
  if(!confirm(`Status auf „${labels[status]}“ setzen?`))return;
  await api(`/kristine/api/material-requests/${encodeURIComponent(id)}`,{
    method:"PATCH",
    body:JSON.stringify({status})
  });
  await loadRequests();
}

async function loadMaterials(){
  const q=document.getElementById("search").value;
  const groupValue=document.getElementById("group").value;
  const data=await api(`/admin/api/materials?q=${encodeURIComponent(q)}&group=${encodeURIComponent(groupValue)}&limit=2000`);
  const s=data.summary;
  count.textContent=s.activeCount;
  stale.textContent=s.stalePriceCount;
  inboxCount.textContent=s.inboxOpenCount;
  groups.textContent=Object.keys(s.byGroup||{}).length;
  dataStatus.textContent=`Datenstand ${s.dataStatus||"noch offen"}`;
  const select=document.getElementById("group");
  const current=select.value;
  select.innerHTML='<option value="">Alle Gruppen</option>'+Object.keys(s.byGroup||{}).sort().map(g=>`<option>${escapeHtml(g)}</option>`).join("");
  select.value=current;
  materialRows.innerHTML=data.materials.map(m=>`<tr>
    <td><strong>${escapeHtml(m.materialId)}</strong></td>
    <td>${escapeHtml(m.group)}<br><span class="muted">${escapeHtml(m.subgroup)}</span></td>
    <td><strong>${escapeHtml([m.manufacturer,m.product].filter(Boolean).join(" · "))}</strong><br><span class="muted">${escapeHtml(m.unit||"")}</span></td>
    <td>${m.colorNumber?`<strong>${escapeHtml(m.colorNumber)}</strong> · `:""}${escapeHtml(m.colorName||"")}</td>
    <td>${money(m.purchasePrice)} / ${money(m.salePrice)}<br><span class="muted">Ertrag ${money(m.materialYield)}</span></td>
    <td><span class="pill ${m.priceStaleLevel==="red"?"red":m.priceStale?"yellow":""}">${escapeHtml(m.priceCheckedAt||m.priceValidFrom||"nicht geprüft")}</span></td>
    <td>${m.priceStale?`<button class="btn" onclick="checkPrice('${js(m.materialId)}')">Preis geprüft</button>`:"✓"}</td>
  </tr>`).join("");
}

async function loadInbox(){
  const data=await api("/admin/api/material-inbox?status=open");
  inboxItems=data.items;
  inboxCount.textContent=data.items.length;
  inboxRows.innerHTML=data.items.length?data.items.map(x=>`<div class="inbox-item">
    <strong>${escapeHtml(x.description||x.productSuggestion||"Unbekanntes Material")}</strong>
    <p class="muted">${escapeHtml(x.quantity||"")} ${escapeHtml(x.unit||"")} · ${escapeHtml(x.jobName||x.jobId||"ohne Baustelle")} · ${escapeHtml(x.employeeName||"")}</p>
    <button class="btn primary" onclick="openLearn('${js(x.id)}')">Einmal sauber anlegen</button>
  </div>`).join(""):'<div class="card">Alles gelernt. 💚</div>';
}

function openLearn(id){
  const x=inboxItems.find(v=>v.id===id);if(!x)return;
  learnId.value=x.id;learnGroup.value=x.groupSuggestion||"";learnSubgroup.value=x.subgroupSuggestion||"";
  learnManufacturer.value=x.manufacturerSuggestion||"";learnProduct.value=x.productSuggestion||x.description||"";
  learnColorNumber.value=x.colorNumberSuggestion||"";learnColorName.value=x.colorNameSuggestion||"";
  learnUnit.value=x.unit||"";learnPriceDate.value=new Date().toISOString().slice(0,10);
  learnDialog.showModal();
}
async function approveMaterial(e){
  e.preventDefault();
  await api(`/admin/api/material-inbox/${encodeURIComponent(learnId.value)}/approve`,{method:"POST",body:JSON.stringify({
    group:learnGroup.value,subgroup:learnSubgroup.value,manufacturer:learnManufacturer.value,product:learnProduct.value,
    colorNumber:learnColorNumber.value,colorName:learnColorName.value,unit:learnUnit.value,locationMode:learnLocation.value,
    purchasePrice:learnEk.value,salePrice:learnVk.value,priceValidFrom:learnPriceDate.value,priceCheckedAt:learnPriceDate.value,
    designRelevant:learnDesign.value==="true",approvedBy:"Bettina / Büro"
  })});
  learnDialog.close();await Promise.all([loadMaterials(),loadInbox()]);
  alert("Gelernt. Dieses Material steht ab jetzt überall zur Verfügung.");
}
async function checkPrice(id){
  await api(`/admin/api/materials/${encodeURIComponent(id)}/check-price`,{method:"POST",body:JSON.stringify({priceCheckedAt:new Date().toISOString().slice(0,10)})});
  loadMaterials();
}
async function importExcel(file){
  if(!file)return;
  const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(file)});
  const data=await api("/admin/api/materials/import-excel",{method:"POST",body:JSON.stringify({filename:file.name,base64})});
  const r=data.report;alert(`Import fertig\nNeu: ${r.added}\nGeändert: ${r.changed}\nUnverändert: ${r.unchanged}\nDubletten: ${r.duplicateCount}`);
  loadMaterials();
}
function exportExcel(){location.href="/admin/api/materials/export-excel?token="+encodeURIComponent(token)}
function showTab(name){
  requests.classList.toggle("hidden",name!=="requests");
  materials.classList.toggle("hidden",name!=="materials");
  inbox.classList.toggle("hidden",name!=="inbox");
  tabRequests.classList.toggle("active",name==="requests");
  tabMaterials.classList.toggle("active",name==="materials");
  tabInbox.classList.toggle("active",name==="inbox");
  if(name==="requests")loadRequests();
  if(name==="inbox")loadInbox();
}
function money(v){return Number(v||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"})}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}

Promise.all([loadMaterials(),loadInbox(),loadRequests()]);
</script>
</body>
</html>
