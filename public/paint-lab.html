<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRISTINE Farben & Lager</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#20231f;--muted:#73776f;--line:#dedfd9;--accent:#1f5d42;--green:#dff3e4;--greenB:#3e8a55;--orange:#fff0cf;--orangeB:#d78a16;--red:#fde0de;--redB:#c9433b;--gray:#eceeea}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.title{font-size:28px;font-weight:800}.sub{color:var(--muted);font-size:13px}.tabs,.systems{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.searchbox{display:flex;gap:9px;margin-top:14px}.searchbox input,.field{width:100%;padding:14px;border:1px solid #cfd1ca;border-radius:11px;font-size:17px;background:white}.results{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}.hit{padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:20px}.hit:first-child{border-top:0}.hit:hover{background:#f4f7f4}.alias{font-size:12px;color:#786b42}.selected{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.selected h2{margin:0;font-size:25px}.chip{border-radius:999px;padding:5px 10px;background:#f0f2ed;font-size:12px}.product{padding:14px 0;border-top:1px solid var(--line)}.product:first-child{border-top:0}.prodhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.prodname{font-weight:800;font-size:16px}.base{font-weight:700;color:#5c645b}.sizes{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.stock{border:1px solid;border-radius:10px;padding:7px 9px;min-width:86px;font-weight:800}.stock small{display:block;font-size:10px;font-weight:600;opacity:.75;margin-top:2px}.s-green{background:var(--green);border-color:var(--greenB)}.s-orange{background:var(--orange);border-color:var(--orangeB)}.s-red{background:var(--red);border-color:var(--redB)}.s-na{background:var(--gray);border-color:#c5c8c2;color:#777}.recipeBtn{border:0;background:#eef3ef;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:750}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none!important}.scanResult{font-size:17px}.bigstock{font-size:32px;font-weight:850}.choice{display:flex;gap:8px;margin:12px 0}.status{font-size:13px;color:var(--muted);white-space:pre-wrap}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalCard{background:white;border-radius:16px;padding:20px;max-width:660px;width:100%;max-height:85vh;overflow:auto}.rtable{width:100%;border-collapse:collapse}.rtable th,.rtable td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filebox{border:1px dashed #bbb;border-radius:12px;padding:15px}.kpi{display:flex;gap:12px;flex-wrap:wrap}.kpi span{background:#f2f4ef;padding:6px 9px;border-radius:8px;font-size:12px}.muted{color:var(--muted)}@media(max-width:750px){.grid2,.tools{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:12px}.prodhead{align-items:flex-start}.stock{min-width:74px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="title">KRISTINE · Farben & Lager</div><div class="sub">Mischwissen + Lagerwissen · ≥2 grün · 1 orange · 0 rot</div></div><div class="tabs"><button class="btn active" data-tab="search">Farbsuche</button><button class="btn" data-tab="scan">Scan Abgang</button><button class="btn" data-tab="admin">Import & Lernen</button></div></div>
<section id="tab-search"><div class="card"><div class="systems"><button class="btn active" data-system="LG">Little Greene</button><button class="btn" data-system="F&B">Farrow & Ball</button><button class="btn" data-system="NCS">NCS</button><button class="btn" data-system="RAL">RAL</button></div><div class="searchbox"><input id="q" placeholder="Name oder Nummer eingeben …" autocomplete="off"></div><div id="results" class="results"></div></div><div id="detail" class="card hidden"></div></section>
<section id="tab-scan" class="hidden"><div class="grid2"><div class="card"><h2>Dose scannen</h2><input id="ean" class="field" inputmode="numeric" placeholder="EAN scannen …"><div id="scanInfo" class="status" style="margin-top:10px"></div></div><div id="scanAction" class="card hidden"><div id="scanArticle" class="scanResult"></div><div class="choice"><button class="btn primary" id="saleBtn">Verkauf</button><button class="btn" id="projectBtn">Baustelle</button></div><div id="projectWrap" class="hidden"><select id="job" class="field"></select></div><div style="display:flex;gap:8px;margin-top:10px"><input id="qty" class="field" type="number" min="1" step="1" value="1" style="max-width:120px"><button id="bookOut" class="btn primary">Abgang buchen</button></div><div id="moveStatus" class="status" style="margin-top:8px"></div></div></div></section>
<section id="tab-admin" class="hidden"><div class="tools"><div class="card"><h2>Excel-Erstimport</h2><p class="muted">Lagerliste Farben → Bestand/EAN/Preise. F&B → Sonder-/Scheinnamen.</p><div class="filebox"><input type="file" id="excelFile" accept=".xlsx"><button class="btn primary" id="excelImport">Excel importieren</button></div><div id="excelStatus" class="status"></div></div><div class="card"><h2>Innovatint-Katalog</h2><p class="muted">Export vom geklonten MariaDB-Stand: Farben, Produkte, Basen, Gebinde und Rezepte.</p><div class="filebox"><input type="file" id="catalogFile" accept=".json"><button class="btn primary" id="catalogImport">Katalog importieren</button></div><div id="catalogStatus" class="status"></div></div></div><div class="card"><h2>Status</h2><div id="systemStatus" class="kpi"></div><div style="margin-top:12px"><label>ml je Maschinen-Einheit</label><input id="unitMl" class="field" style="max-width:230px"><button id="saveSettings" class="btn">Speichern</button></div></div></section>
</div>
<div id="recipeModal" class="modal"><div class="modalCard"><div style="display:flex;justify-content:space-between"><h2 id="recipeTitle" style="margin-top:0">Rezept</h2><button class="btn" id="closeRecipe">Schließen</button></div><div id="recipeBody"></div></div></div>
<script>
const qs=new URLSearchParams(location.search);const token=qs.get('token')||'';let system='LG',selected=null,scanArticle=null,scanReason='sale';
const api=async(url,opt={})=>{const join=url.includes('?')?'&':'?';const r=await fetch(url+(token?join+'token='+encodeURIComponent(token):''),{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({ok:false,error:'Keine JSON-Antwort'}));if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j};
function showTab(name){document.querySelectorAll('[id^=tab-]').forEach(x=>x.classList.add('hidden'));document.querySelector('#tab-'+name).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='scan')setTimeout(()=>document.querySelector('#ean').focus(),50);if(name==='admin')loadStatus()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{system=b.dataset.system;document.querySelectorAll('[data-system]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#q').value='';document.querySelector('#results').style.display='none';document.querySelector('#detail').classList.add('hidden');document.querySelector('#q').focus()});
let timer;document.querySelector('#q').oninput=e=>{clearTimeout(timer);const v=e.target.value.trim();if(v.length<1){results.style.display='none';return}timer=setTimeout(()=>search(v),160)};
async function search(v){try{const d=await api('/admin/api/paint/search?system='+encodeURIComponent(system)+'&q='+encodeURIComponent(v));const el=document.querySelector('#results');el.innerHTML='';for(const h of d.results){const div=document.createElement('div');div.className='hit';const alias=(h.aliases||[]).slice(0,2).join(' · ');div.innerHTML=`<div><b>${esc(h.name||h.code)}</b>${h.code&&h.code!==h.name?` <span class="muted">${esc(h.code)}</span>`:''}</div><div class="alias">${esc(alias||h.altCode||'')}</div>`;div.onclick=()=>selectHit(h);el.appendChild(div)}el.style.display=d.results.length?'block':'none'}catch(e){results.innerHTML='<div class="hit">'+esc(e.message)+'</div>';results.style.display='block'}}
async function selectHit(h){selected=h;results.style.display='none';q.value=h.name||h.code||'';try{const d=await api('/admin/api/paint/color/'+encodeURIComponent(h.id)+'?system='+encodeURIComponent(system));renderDetail(d)}catch(e){detail.classList.remove('hidden');detail.innerHTML='<b>'+esc(e.message)+'</b>'}}
function stockClass(v){if(v===null||v===undefined)return's-na';if(v>=2)return's-green';if(v===1)return's-orange';return's-red'}
function renderDetail(d){const c=d.color;let alias=(c.aliases||[]).length?`<div style="margin-top:7px">Sondername: ${(c.aliases||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')}</div>`:'';let html=`<div class="selected"><div><h2>${esc(c.name||c.code)}</h2><div class="muted">${esc(c.code||'')}</div>${alias}</div><span class="chip">${esc(c.system)}</span></div>`;if(d.products?.length){html+='<div style="margin-top:14px">';for(const p of d.products){html+=`<div class="product"><div class="prodhead"><div><div class="prodname">${esc(p.productName)}</div><div class="base">${esc(p.baseName||p.baseCode)}</div></div>${p.recipeAvailable?`<button class="recipeBtn" onclick='openRecipe(${JSON.stringify(c.id)},${p.productId},${JSON.stringify(p.productName)},${JSON.stringify(p.sizes)})'>Rezept</button>`:''}</div><div class="sizes">`;for(const s of p.sizes||[]){const price=s.purchasePrice?`EK € ${Number(s.purchasePrice).toFixed(2)}`:'';const val=s.stock===null?'—':s.stock;html+=`<div class="stock ${stockClass(s.stock)}" title="${esc(s.ean||'')}">${esc(s.size)}: ${val}<small>${price}</small></div>`}html+='</div></div>'}html+='</div>'}else if(c.system==='F&B'){html+='<p class="muted">Übersetzungstabelle / Sondernamen. Kein eigener Lagerbestand hinterlegt.</p>'}detail.innerHTML=html;detail.classList.remove('hidden')}
window.openRecipe=async(colourId,productId,productName,sizes)=>{const valid=(sizes||[]).filter(s=>s.canSizeId);if(!valid.length)return alert('Keine Innovatint-Gebinde-ID vorhanden.');let size=valid.find(s=>s.size==='5 L')||valid[0];const labels=valid.map((s,i)=>`${i+1}: ${s.size}`).join('\n');const ans=prompt('Gebinde wählen:\n'+labels,String(valid.indexOf(size)+1));if(ans===null)return;size=valid[Math.max(0,Math.min(valid.length-1,Number(ans)-1))]||size;try{const d=await api(`/admin/api/paint/recipe?colourId=${colourId}&productId=${productId}&canSizeId=${size.canSizeId}`);recipeTitle.textContent=`${selected?.name||''} · ${productName} · ${d.canSize}`;recipeBody.innerHTML=`<div class="kpi"><span>Formel ${d.formulaId}</span><span>1 Einheit ≈ ${Number(d.recipeUnitMl).toFixed(5)} ml</span></div><table class="rtable"><thead><tr><th>Paste</th><th>Einheiten</th><th>ml</th></tr></thead><tbody>${d.recipe.map(r=>`<tr><td><b>${esc(r.code)}</b> ${esc(r.description)}</td><td>${Number(r.machineUnits).toFixed(2)}</td><td>${Number(r.ml).toFixed(2)}</td></tr>`).join('')}</tbody></table><p class="muted">${esc(d.calibrationNote||'')}</p>`;recipeModal.classList.add('show')}catch(e){alert(e.message)}};
closeRecipe.onclick=()=>recipeModal.classList.remove('show');recipeModal.onclick=e=>{if(e.target===recipeModal)recipeModal.classList.remove('show')};let scanTimer;ean.oninput=e=>{clearTimeout(scanTimer);const v=e.target.value.replace(/\D/g,'');if(v.length>=8)scanTimer=setTimeout(()=>scan(v),120)};ean.onkeydown=e=>{if(e.key==='Enter')scan(ean.value)};
async function scan(v){try{const d=await api('/admin/api/paint/scan?ean='+encodeURIComponent(v));scanArticle=d.article;scanInfo.textContent='';scanAction.classList.remove('hidden');renderScanArticle()}catch(e){scanArticle=null;scanAction.classList.add('hidden');scanInfo.textContent=e.message}}
function renderScanArticle(){if(!scanArticle)return;document.querySelector('#scanArticle').innerHTML=`<b>${esc(scanArticle.product)}</b><br>${esc(scanArticle.baseName)} · ${esc(scanArticle.size)}<div class="bigstock">Bestand: ${scanArticle.stock}</div>`}
saleBtn.onclick=()=>{scanReason='sale';saleBtn.classList.add('primary');projectBtn.classList.remove('primary');projectWrap.classList.add('hidden')};projectBtn.onclick=async()=>{scanReason='project';projectBtn.classList.add('primary');saleBtn.classList.remove('primary');projectWrap.classList.remove('hidden');const d=await api('/admin/api/paint/jobs');job.innerHTML=d.jobs.map(j=>`<option value="${esc(j.id)}">${esc(j.id)} · ${esc(j.name)}</option>`).join('')};bookOut.onclick=async()=>{if(!scanArticle)return;try{const d=await api('/admin/api/paint/movement',{method:'POST',body:JSON.stringify({articleId:scanArticle.id,direction:'out',quantity:Number(qty.value||1),reason:scanReason,jobId:scanReason==='project'?job.value:''})});scanArticle=d.article;renderScanArticle();moveStatus.textContent=`Gebucht: ${d.movement.before} → ${d.movement.after}`;ean.value='';setTimeout(()=>ean.focus(),50)}catch(e){moveStatus.textContent=e.message}};
excelImport.onclick=async()=>{const f=excelFile.files[0];if(!f)return;excelStatus.textContent='Import läuft …';const b64=await fileBase64(f);try{const d=await api('/admin/api/paint/import-excel',{method:'POST',body:JSON.stringify({base64:b64})});excelStatus.textContent=`Fertig: ${d.articles} Lagerartikel · ${d.fbAliases} F&B-Aliase`;loadStatus()}catch(e){excelStatus.textContent=e.message}};catalogImport.onclick=async()=>{const f=catalogFile.files[0];if(!f)return;catalogStatus.textContent='Import läuft …';try{const text=await f.text();const d=await api('/admin/api/paint/import-innovatint',{method:'POST',body:text});catalogStatus.textContent=`Fertig: ${d.colors} Farben · ${d.products} Produkte · ${d.formulas} Rezepte`;loadStatus()}catch(e){catalogStatus.textContent=e.message}};
async function loadStatus(){try{const d=await api('/admin/api/paint/status');systemStatus.innerHTML=`<span>Lagerartikel ${d.articles}</span><span>F&B Aliase ${d.fbAliases}</span><span>Farben ${d.catalog?.colors||0}</span><span>Rezepte ${d.catalog?.formulas||0}</span>`;unitMl.value=d.settings.recipeUnitMl}catch(e){systemStatus.textContent=e.message}};saveSettings.onclick=async()=>{try{await api('/admin/api/paint/settings',{method:'PUT',body:JSON.stringify({recipeUnitMl:Number(unitMl.value)})});loadStatus()}catch(e){alert(e.message)}};
function fileBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
