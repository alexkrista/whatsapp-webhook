name: Innovatint history watch syntax

on:
  push:
    paths:
      - 'tools/watch-innovatint-tint-history.ps1'
      - '.github/workflows/innovatint-history-watch-test.yml'
  pull_request:
    paths:
      - 'tools/watch-innovatint-tint-history.ps1'
      - '.github/workflows/innovatint-history-watch-test.yml'

jobs:
  powershell51-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('tools/watch-innovatint-tint-history.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
