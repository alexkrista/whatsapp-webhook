name: Restfarben hardware integration

on:
  push:
    paths:
      - 'paint-lab-preload.js'
      - 'paint-return-stock.js'
      - 'public/paint-return-stock-ui.js'
      - 'public/paint-return-local-hardware-ui.js'
      - 'public/ui/access-status-ui.js'
      - 'public/ui/topbar.js'
      - 'public/paint-return-enhancements-ui.js'
      - 'tools/kristine-paint-local-bridge.ps1'
      - 'tools/install-kristine-paint-local-bridge.ps1'
      - 'tools/install-kristine-paint-windows-service.ps1'
      - 'tools/kristine-paint-sample-label.ps1'
      - 'tools/krista-sample-logo-gfa.txt'
      - 'public/paint-sample-label-ui.js'
      - 'TEST/paint-sample-label-zpl.test.ps1'
      - 'TEST/paint-sample-label-ui.test.js'
      - 'TEST/paint-free-multiline-zpl.test.ps1'
      - 'TEST/paint-service-installer-version.test.ps1'
      - 'TEST/paint-free-multiline-ui.test.js'
      - 'TEST/paint-return-stock.test.js'
      - 'TEST/paint-camper-json-order.test.js'
      - 'TEST/paint-return-stock-ui.test.js'
      - 'TEST/paint-return-colour-search.test.js'
      - 'paint-lab.js'
      - '.github/workflows/paint-return-hardware-test.yml'
  pull_request:
    paths:
      - 'paint-lab-preload.js'
      - 'paint-return-stock.js'
      - 'public/paint-return-stock-ui.js'
      - 'public/paint-return-local-hardware-ui.js'
      - 'public/ui/access-status-ui.js'
      - 'public/ui/topbar.js'
      - 'public/paint-return-enhancements-ui.js'
      - 'tools/kristine-paint-local-bridge.ps1'
      - 'tools/install-kristine-paint-local-bridge.ps1'
      - 'tools/install-kristine-paint-windows-service.ps1'
      - 'tools/kristine-paint-sample-label.ps1'
      - 'tools/krista-sample-logo-gfa.txt'
      - 'public/paint-sample-label-ui.js'
      - 'TEST/paint-sample-label-zpl.test.ps1'
      - 'TEST/paint-sample-label-ui.test.js'
      - 'TEST/paint-free-multiline-zpl.test.ps1'
      - 'TEST/paint-service-installer-version.test.ps1'
      - 'TEST/paint-free-multiline-ui.test.js'
      - 'TEST/paint-return-stock.test.js'
      - 'TEST/paint-camper-json-order.test.js'
      - 'TEST/paint-return-stock-ui.test.js'
      - 'TEST/paint-return-colour-search.test.js'
      - 'paint-lab.js'
      - '.github/workflows/paint-return-hardware-test.yml'

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check paint-lab-preload.js
          node --check paint-return-stock.js
          node --check public/paint-return-stock-ui.js
          node --check public/paint-return-local-hardware-ui.js
          node --check public/paint-sample-label-ui.js
          node --check public/ui/access-status-ui.js
          node --check public/ui/topbar.js
          node --check public/paint-return-enhancements-ui.js
      - name: Return stock backend test
        run: node TEST/paint-return-stock.test.js
      - name: Camper JSON parser and real HTTP return-booking regression
        run: node TEST/paint-camper-json-order.test.js
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/return-test-runtime" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          echo "NODE_PATH=$RUNNER_TEMP/return-test-runtime/node_modules" >> "$GITHUB_ENV"
      - name: Return UI, hardware and colour search regression tests
        run: |
          node TEST/paint-return-stock-ui.test.js
          node TEST/paint-return-colour-search.test.js
          node TEST/paint-free-multiline-ui.test.js
          node TEST/paint-sample-label-ui.test.js

  powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $files = @(
            'tools/kristine-paint-local-bridge.ps1',
            'tools/install-kristine-paint-local-bridge.ps1',
            'tools/install-kristine-paint-windows-service.ps1',
            'tools/kristine-paint-sample-label.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }

      - name: Multiline ZPL generation (no physical print)
        shell: powershell
        run: .\TEST\paint-free-multiline-zpl.test.ps1

      - name: Musteretikett ZPL ohne physischen Druck
        shell: powershell
        run: .\TEST\paint-sample-label-zpl.test.ps1

      - name: Installer version and safe rollback regression
        shell: powershell
        run: .\TEST\paint-service-installer-version.test.ps1
