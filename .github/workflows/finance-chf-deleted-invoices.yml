name: Finance CHF instructions and invoice approval cleanup
on:
  pull_request:
    paths:
      - 'brain_finance_runtime.py'
      - 'brain_currency_payment_v2.py'
      - 'TEST/test_capture_chf_bic.py'
      - 'TEST/test_capture_chf_bic_http.py'
      - 'brain_finance_ui.py'
      - 'TEST/test_finance_chf_and_deleted_invoice.py'
      - '.github/workflows/finance-chf-deleted-invoices.yml'
  push:
    branches: [main]
    paths:
      - 'brain_finance_runtime.py'
      - 'brain_currency_payment_v2.py'
      - 'TEST/test_capture_chf_bic.py'
      - 'TEST/test_capture_chf_bic_http.py'
      - 'brain_finance_ui.py'
      - 'TEST/test_finance_chf_and_deleted_invoice.py'
      - '.github/workflows/finance-chf-deleted-invoices.yml'
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated pure finance tests
        run: python -m unittest discover -s TEST -p test_finance_chf_and_deleted_invoice.py -v
      - name: Set up Python test dependency
        run: pip install Flask
      - name: CHF BIC field required before invoice persistence
        run: |
          python -m unittest discover -s TEST -p test_capture_chf_bic.py -v
          python -m unittest discover -s TEST -p test_capture_chf_bic_http.py -v
      - name: Validate capture BIC UI JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('brain_currency_payment_v2.py').read_text(encoding='utf-8')
          source=re.search(r"script = r'''(.*?)'''",src,re.S)
          assert source is not None
          js=re.search(r"<script[^>]*>(.*?)</script>",source.group(1),re.S)
          assert js is not None
          code=js.group(1).replace('__CURRENCIES__','["EUR","CHF"]')
          assert "captureBic" in code and "bic.required" in code
          assert "bicWrap.hidden=" not in code
          Path('/tmp/krista-capture-bic-ui.js').write_text(code,encoding='utf-8')
          PY
          node --check /tmp/krista-capture-bic-ui.js
      - name: Validate embedded finance UI JavaScript
        run: |
          python - <<'PY'
          from brain_finance_ui import payments_page
          from pathlib import Path
          import re
          html=payments_page()
          matches=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(matches)==1, len(matches)
          assert "foreignPayDialog" in html and "payment-foreign/preview" in html
          assert 'directPaySend' in html and 'CH-IBAN' not in html
          Path('/tmp/brain-payment-chf-embedded.js').write_text(matches[0],encoding='utf-8')
          print("Foreign manual payment UI exported")
          PY
          node --check /tmp/brain-payment-chf-embedded.js
