name: Outgoing invoice yearly totals
on:
  pull_request:
    paths:
      - public/outgoing-invoice-book.html
      - TEST/outgoing-invoice-yearly.test.cjs
      - .github/workflows/outgoing-invoice-yearly.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test TEST/outgoing-invoice-yearly.test.cjs
