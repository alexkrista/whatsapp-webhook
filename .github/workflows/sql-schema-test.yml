name: PostgreSQL schema checks
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'storage/**'
      - 'TEST/*.pg.cjs'
      - '.github/workflows/sql-schema-test.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'storage/**'
      - 'TEST/*.pg.cjs'
      - '.github/workflows/sql-schema-test.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated embedded PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/sql-test-runtime" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Test DDL, constraints, snapshots and document store
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/sql-test-runtime/node_modules/@electric-sql/pglite" node --test TEST/*.pg.cjs
