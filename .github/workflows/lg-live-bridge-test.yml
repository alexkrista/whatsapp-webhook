name: LG live bridge syntax

on:
  push:
    branches:
      - main
      - feature/lg-live-mischmaschine
      - feature/lg-stock-ledger-order-fix
      - feature/lg-order-summary-ledger
  pull_request:
    paths:
      - 'paint-live-bridge.js'
      - 'paint-mix-history.js'
      - 'paint-catalog-sync.js'
      - 'paint-color-stock-overlay.js'
      - 'paint-outflow.js'
      - 'paint-stock-ledger.js'
      - 'paint-stock-ledger-api.js'
      - 'paint-runtime-safety.js'
      - 'paint-order-review.js'
      - 'paint-order-summary-fix.js'
      - 'paint-lab-preload.js'
      - 'paint-inventory-save-preload.js'
      - 'paint-consumption-docs-preload.js'
      - 'paint-ral-classic-names-preload.js'
      - 'public/lg-product-knowledge.json'
      - 'public/lg-product-doc-links-de.json'
      - 'public/paint-live-mix-ui.js'
      - 'public/paint-mix-history-ui.js'
      - 'public/paint-catalog-sync-ui.js'
      - 'public/paint-product-order-ui.js'
      - 'public/paint-inventory-save-fix.js'
      - 'public/paint-consumption-docs-ui.js'
      - 'public/paint-material-docs-de.js'
      - 'public/paint-unmixed-scan-fix.js'
      - 'tools/innovatint-kristine-bridge.ps1'
      - 'tools/innovatint-history-sync.ps1'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax
        run: |
          node --check paint-live-bridge.js
          node --check paint-mix-history.js
          node --check paint-catalog-sync.js
          node --check paint-color-stock-overlay.js
          node --check paint-outflow.js
          node --check paint-stock-ledger.js
          node --check paint-stock-ledger-api.js
          node --check paint-runtime-safety.js
          node --check paint-order-review.js
          node --check paint-order-summary-fix.js
          node --check paint-lab-preload.js
          node --check paint-inventory-save-preload.js
          node --check paint-consumption-docs-preload.js
          node --check paint-ral-classic-names-preload.js
          node --check public/paint-live-mix-ui.js
          node --check public/paint-mix-history-ui.js
          node --check public/paint-catalog-sync-ui.js
          node --check public/paint-product-order-ui.js
          node --check public/paint-inventory-save-fix.js
          node --check public/paint-consumption-docs-ui.js
          node --check public/paint-material-docs-de.js
          node --check public/paint-unmixed-scan-fix.js
          node -e "JSON.parse(require('fs').readFileSync('public/lg-product-knowledge.json','utf8'))"
          node -e "const d=JSON.parse(require('fs').readFileSync('public/lg-product-doc-links-de.json','utf8')); if(!Array.isArray(d.products)||d.products.length<12||!String(d.source||'').includes('littlegreene.de')) process.exit(1)"
          node -e "const t=require('fs').readFileSync('paint-ral-classic-names-preload.js','utf8'); const n=(t.match(/\"[0-9]{4}\":/g)||[]).length; if(n!==216||!t.includes('\"7021\":\"Schwarzgrau\"')) { console.error({n}); process.exit(1) }"
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "tools/innovatint-kristine-bridge.ps1",
            "tools/innovatint-history-sync.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "Syntaxfehler in $file"
              $errors | Format-List
              exit 1
            }
          }
